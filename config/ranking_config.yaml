pipeline:
  phase2_bi_encoder:
    model_name: "all-mpnet-base-v2"
    device: "cpu"
    top_n_pool: 1000
    blend_weights:
      rule_score: 0.75
      semantic_score: 0.25
    extraction:
      max_roles: 3
      max_skills: 15

  phase3_cross_encoder:
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    device: "cpu"
    top_n_pool: 300
    blend_weights:
      prev_score: 0.70
      semantic_score: 0.30

  output:
    top_k: 100

scoring_weights:
  career_fit: 0.40
  skill_auth: 0.30
  behavioral: 0.15
  logistics: 0.10
  education: 0.05

honeypot:
  dataset_year: 2026

  # 1. Historical Baseline Validations
  tech_birth_years:
    # -- General GenAI (Your list) --
    chatgpt: 2022
    gpt-4: 2023
    gpt4: 2023
    claude: 2023
    gemini: 2023
    midjourney: 2022
    stable diffusion: 2022

    # -- JD-Specific: LLM Fine-Tuning & Frameworks --
    llm fine-tuning: 2020
    llm fine tuning: 2020
    langchain: 2022
    llamaindex: 2022
    llama-index: 2022
    lora: 2021
    qlora: 2023
    peft: 2022
    rag: 2020
    retrieval-augmented generation: 2020

    # -- JD-Specific: Open Source Models --
    llama: 2023
    mistral: 2023
    mixtral: 2023

    # -- JD-Specific: Vector Databases --
    pinecone: 2021
    qdrant: 2021
    weaviate: 2019
    milvus: 2019

    # -- Core Architecture Baseline --
    transformers: 2017
  # 2. Structural Anomaly Limits
  structural_limits:
    max_single_role_months: 480
    max_yoe_discrepancy_years: 5.0
    max_pre_graduation_yoe: 4.0
