# ============================================================================
# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Gemini"
  - "Claude"
  - "Antigravity"

ai_usage_summary: |
  Utilized Gemini and Claude primarily as syntax-checking and rubber-duck debugging 
  partners to accelerate boilerplating and optimize localized data-frame loops. 
  Antigravity was deployed early on to scaffold the initial multi-directory file 
  structures and automate template creation. The mathematical architecture, custom 
  heuristic floor design, and multi-stage pipeline logic were designed and engineered 
  entirely by the core development team.

# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  3-Phase Hybrid Pipeline (Heuristics -> Bi-Encoder -> Cross-Encoder) + Explainability Layer 
  optimized specifically for NDCG@10 precision. 

  Phase 1 computes a composite score across 5 dimensions, enforcing strict structural floors 
  (e.g., hard penalties for YoE < 4.0 or foreign locations requiring visas) and tracking 
  skill authenticity/domain-bleed. Honeypot clones are neutralized via MD5 state-hashing.

  Phase 2 re-ranks the Top 1,000 using 'all-mpnet-base-v2' embeddings, anchored by a strict 
  75% Heuristic / 25% Semantic blend to prevent neural bulldozing. 

  Phase 3 deep-ranks the Top 200 using 'cross-encoder/ms-marco-MiniLM-L-6-v2', calibrated 
  via a Sigmoid function with a 70% Heuristic / 30% Semantic blend.

  The final output is passed to a deterministic prompt template to generate fact-grounded 
  reasoning strings. The system runs 100% offline (0 API calls) executing blazing-fast 
  vector math entirely on standard CPUs.

